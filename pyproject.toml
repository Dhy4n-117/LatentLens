[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "latentlens"
version = "0.1.0"
description = "Video Q&A over the real world with V-JEPA 2 and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "faiss-cpu>=1.8",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.53",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
latentlens = "latentlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/latentlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
